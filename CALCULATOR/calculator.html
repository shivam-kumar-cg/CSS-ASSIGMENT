
<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>

    <div class="calculator">

        <div class="display">
            7744
        </div>

        <div class="buttons">

            <button class="light">C</button>
            <button class="light">+/-</button>
            <button class="light">%</button>
            <button class="orange">÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="orange">X</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="orange">-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="orange">+</button>

            <button class="zero">0</button>
            <button>,</button>
            <button class="orange">=</button>

        </div>

    </div>

</body>
</html>
