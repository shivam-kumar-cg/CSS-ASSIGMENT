
<!DOCTYPE html>
<html>
<head>
    <title>Ludo</title>
    <link rel="stylesheet" href="ludo.css">
</head>
<body>

    <div class="board">

        <div class="home red">
            <div class="inner">
                <div class="coin"></div>
                <div class="coin"></div>
                <div class="coin"></div>
                <div class="coin"></div>
            </div>
        </div>

        <div class="path vertical green-path">
            <div></div><div></div><div></div>
            <div></div><div class="green"></div><div class="green">★</div>
            <div class="green">★</div><div class="green"></div><div></div>
            <div></div><div class="green"></div><div></div>
            <div></div><div class="green"></div><div></div>
            <div></div><div class="green"></div><div></div>
        </div>

        <div class="home green-home">
            <div class="inner">
                <div class="coin"></div>
                <div class="coin"></div>
                <div class="coin"></div>
                <div class="coin"></div>
            </div>
        </div>

        <div class="path horizontal red-path">
            <div></div><div class="red">★</div><div></div>
            <div></div><div></div><div></div>

            <div></div><div class="red"></div><div class="red"></div>
            <div class="red"></div><div class="red"></div><div class="red"></div>

            <div></div><div></div><div class="red">★</div>
            <div></div><div></div><div></div>
        </div>

        <div class="center">
            <div class="triangle green-triangle"></div>
            <div class="triangle red-triangle"></div>
            <div class="triangle yellow-triangle"></div>
            <div class="triangle blue-triangle"></div>
        </div>

        <div class="path horizontal yellow-path">
            <div></div><div></div><div></div>
            <div class="yellow">★</div><div></div><div></div>

            <div class="yellow"></div><div class="yellow"></div>
            <div class="yellow"></div><div class="yellow"></div>
            <div class="yellow"></div><div></div>

            <div></div><div></div><div></div>
            <div></div><div class="yellow">★</div><div></div>
        </div>
        <div class="home blue-home">
            <div class="inner">
                <div class="coin"></div>
                <div class="coin"></div>
                <div class="coin"></div>
                <div class="coin"></div>
            </div>
        </div>

        <div class="path vertical blue-path">
            <div></div><div class="blue"></div><div></div>
            <div></div><div class="blue"></div><div></div>
            <div></div><div class="blue"></div><div></div>
            <div></div><div class="blue"></div><div class="blue">★</div>
            <div class="blue">★</div><div class="blue"></div><div></div>
            <div></div><div></div><div></div>
        </div>

        <div class="home yellow-home">
            <div class="inner">
                <div class="coin"></div>
                <div class="coin"></div>
                <div class="coin"></div>
                <div class="coin"></div>
            </div>
        </div>

    </div>

</body>
</html>
